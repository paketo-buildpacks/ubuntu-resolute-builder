description = "Ubuntu 26.04 Resolute Raccoon base image with buildpacks for Go, Java, Node.js, .NET, PHP, Procfile and Ruby"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-resolute-build:0.0.48"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/dotnet-core:4.15.0"
  version = "4.15.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/go:4.23.3"
  version = "4.23.3"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java-native-image:14.14.4"
  version = "14.14.4"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java:22.8.0"
  version = "22.8.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:10.15.0"
  version = "10.15.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/php:3.7.6"
  version = "3.7.6"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.15.7"
  version = "5.15.7"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/ruby:3.4.0"
  version = "3.4.0"

[lifecycle]
  version = "0.21.28"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/dotnet-core"
    version = "4.15.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/go"
    version = "4.23.3"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java-native-image"
    version = "14.14.4"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java"
    version = "22.8.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/nodejs"
    version = "10.15.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/php"
    version = "3.7.6"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.15.7"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/ruby"
    version = "3.4.0"

[run]

  [[run.images]]
    image = "docker.io/paketobuildpacks/ubuntu-resolute-run:latest"

[stack]
  id = "io.buildpacks.stacks.resolute"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
