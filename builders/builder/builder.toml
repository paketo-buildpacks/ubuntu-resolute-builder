description = "Ubuntu 26.04 Resolute Raccoon base image with buildpacks for Go, Java, Node.js, .NET, PHP, Procfile and Ruby"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-resolute-build:0.0.43"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/dotnet-core:4.14.0"
  version = "4.14.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/go:4.23.2"
  version = "4.23.2"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java-native-image:14.14.3"
  version = "14.14.3"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java:22.7.3"
  version = "22.7.3"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:10.14.2"
  version = "10.14.2"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/php:3.7.5"
  version = "3.7.5"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.15.6"
  version = "5.15.6"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/ruby:3.3.0"
  version = "3.3.0"

[lifecycle]
  version = "0.21.26"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/dotnet-core"
    version = "4.14.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/go"
    version = "4.23.2"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java-native-image"
    version = "14.14.3"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java"
    version = "22.7.3"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/nodejs"
    version = "10.14.2"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/php"
    version = "3.7.5"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.15.6"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/ruby"
    version = "3.3.0"

[run]

  [[run.images]]
    image = "docker.io/paketobuildpacks/ubuntu-resolute-run:latest"

[stack]
  id = "io.buildpacks.stacks.resolute"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
