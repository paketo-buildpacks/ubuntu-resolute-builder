description = "Ubuntu 26.04 Resolute Raccoon base image with buildpacks for Go, Java, Node.js, .NET, PHP, Procfile and Ruby"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-resolute-build:0.0.36"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/dotnet-core:4.12.4"
  version = "4.12.4"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/go:4.22.2"
  version = "4.22.2"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java-native-image:14.13.0"
  version = "14.13.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java:22.6.0"
  version = "22.6.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:10.13.2"
  version = "10.13.2"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/php:3.7.2"
  version = "3.7.2"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.15.4"
  version = "5.15.4"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/ruby:3.1.3"
  version = "3.1.3"

[lifecycle]
  version = "0.21.25"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/dotnet-core"
    version = "4.12.4"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/go"
    version = "4.22.2"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java-native-image"
    version = "14.13.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java"
    version = "22.6.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/nodejs"
    version = "10.13.2"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/php"
    version = "3.7.2"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.15.4"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/ruby"
    version = "3.1.3"

[run]

  [[run.images]]
    image = "docker.io/paketobuildpacks/ubuntu-resolute-run:latest"

[stack]
  id = "io.buildpacks.stacks.resolute"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
