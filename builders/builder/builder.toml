description = "Ubuntu 26.04 Resolute Raccoon base image with buildpacks for Java, Node.js, .NET, PHP, Procfile and Ruby"

[build]
  image = "docker.io/paketobuildpacks/ubuntu-resolute-build:0.0.19"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/dotnet-core:4.9.0"
  version = "4.9.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java-native-image:14.11.0"
  version = "14.11.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java:22.4.0"
  version = "22.4.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/nodejs:10.10.0"
  version = "10.10.0"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/php:3.3.1"
  version = "3.3.1"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.13.7"
  version = "5.13.7"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/ruby:3.0.3"
  version = "3.0.3"

[lifecycle]
  version = "0.21.18"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/dotnet-core"
    version = "4.9.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java-native-image"
    version = "14.11.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java"
    version = "22.4.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/nodejs"
    version = "10.10.0"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/php"
    version = "3.3.1"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.13.7"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/ruby"
    version = "3.0.3"

[run]

  [[run.images]]
    image = "docker.io/paketobuildpacks/ubuntu-resolute-run:latest"

[stack]
  id = "io.buildpacks.stacks.resolute"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
