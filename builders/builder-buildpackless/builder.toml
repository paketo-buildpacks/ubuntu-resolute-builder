description = 'Ubuntu 26.04 Resolute Raccoon base image with no buildpacks included. To use, specify buildpacks at build time.'

[lifecycle]
version = '0.21.29'

[build]
image = 'docker.io/paketobuildpacks/ubuntu-resolute-build:0.0.48'

[run]
[[run.images]]
image = 'docker.io/paketobuildpacks/ubuntu-resolute-run:latest'

[stack]
id = 'io.buildpacks.stacks.resolute'

[[targets]]
os = 'linux'
arch = 'amd64'

[[targets]]
os = 'linux'
arch = 'arm64'
